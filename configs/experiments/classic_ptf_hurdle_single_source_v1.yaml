# Structural PTF path on FastTD3/HumanoidBench, without RBO/MCG/admission.
ptf:
  source_bank: configs/source_banks/pure_ptf/h1hand_hurdle_walk.yaml

  option_hidden_dims: [256, 256]
  option_lr: 0.0003
  beta_lr: 0.0001
  # Train termination from the beginning: this experiment is specifically
  # intended to test the learned beta mechanism rather than freeze it.
  beta_warmup_steps: 0
  option_tau: 0.05
  option_epsilon_start: 0.30
  option_epsilon_end: 0.05
  option_epsilon_decay_steps: 50000
  option_min_steps: 1
  xi: 0.0

  # The PTF imitation coefficient covers the complete 100k training budget and
  # reaches zero at the end, so the final target policy is source-free.
  transfer_lambda_start: 1.0
  transfer_lambda_end: 0.0
  transfer_decay_steps: 100000
  transfer_loss: huber
  transfer_huber_delta: 1.0
  beta_weighted_transfer: true
  update_all_compatible_options: true

  # Explicitly exclude all post-PTF project mechanisms.
  execute_sources: false
  mcg: false
  mcg_replay_reweight: false
  mcg_replay_mode: "off"
  mcg_abstain_gate: false
  admission_mode: legacy
  admission_adaptive: false
