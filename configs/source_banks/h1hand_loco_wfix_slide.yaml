# expanded terrain wfix bank for slide(weighted 源同 safe, horizon 固定
# 25=warmup_min_steps; 消融解耦源选择 vs 执行时长)
null_option: true
sources:
- name: stand
  manifest: checkpoints/official_sources/h1hand_stand/manifest.json
  obs_adapter:
    type: identity
    output_dim: 151
  action_adapter:
    type: passthrough
  action_mask:
    type: full
  compatibility_sigma: 1.5
  bootstrap:
    weight: 0.967
    horizon: 25
- name: walk
  manifest: checkpoints/official_sources/h1hand_walk/manifest.json
  obs_adapter:
    type: identity
    output_dim: 151
  action_adapter:
    type: passthrough
  action_mask:
    type: full
  compatibility_sigma: 1.5
  bootstrap:
    weight: 25.487
    horizon: 25
- name: run
  manifest: checkpoints/official_sources/h1hand_run/manifest.json
  obs_adapter:
    type: identity
    output_dim: 151
  action_adapter:
    type: passthrough
  action_mask:
    type: full
  compatibility_sigma: 1.5
  bootstrap:
    weight: 19.473
    horizon: 25
