# 扩源 weighted bank for truck(7 源+vs-zero weight, horizon=25;
# weight 来自 transfer_map_v2_bigsrc.jsonl 同批 probe;
# 由 build_bigsrc_banks.py 自动生成,勿手改)。
null_option: true
sources:
- name: stand
  manifest: checkpoints/official_sources/h1hand_stand/manifest.json
  obs_adapter:
    type: hb_robot_qpos_qvel
    qpos_dim: 111
    output_dim: 151
  action_adapter:
    type: passthrough
  action_mask:
    type: full
  compatibility_sigma: 1.5
  bootstrap:
    weight: 5.1601
    horizon: 25
