# Conservative h1hand-door source bank.
# Door observations inherit HumanoidBench Task.get_obs(): full qpos (78) then
# full qvel (77), so robot proprioception must be extracted explicitly.
sources:
  - name: stand
    manifest: checkpoints/sources/h1hand_stand/manifest.json
    obs_adapter:
      type: humanoidbench_robot_qpos_qvel
      qpos_dim: 78
      robot_dof: 76
    action_adapter:
      type: passthrough
    action_mask:
      type: groups
      schema: h1hand_default
      groups: [legs_torso, arms]
    compatibility_sigma: 0.25

  - name: walk
    manifest: checkpoints/sources/h1hand_walk/manifest.json
    obs_adapter:
      type: humanoidbench_robot_qpos_qvel
      qpos_dim: 78
      robot_dof: 76
    action_adapter:
      type: passthrough
    action_mask:
      type: groups
      schema: h1hand_default
      groups: [legs_torso]
    compatibility_sigma: 0.25

  - name: run
    manifest: checkpoints/sources/h1hand_run/manifest.json
    obs_adapter:
      type: humanoidbench_robot_qpos_qvel
      qpos_dim: 78
      robot_dof: 76
    action_adapter:
      type: passthrough
    action_mask:
      type: groups
      schema: h1hand_default
      groups: [legs_torso]
    compatibility_sigma: 0.25

null_option:
  enabled: true
  name: no_transfer
