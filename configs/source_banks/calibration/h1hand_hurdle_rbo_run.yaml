# Equal-dose source-specific RBO calibration on h1hand-hurdle-v0.
# The source logit is 0 and the student logit is fixed to 0 by the launcher,
# giving candidate masses [0.5 source, 0.5 student] in admission_bootstrap.
null_option: true
sources:
- name: run
  manifest: checkpoints/official_sources/h1hand_run/manifest.json
  obs_adapter:
    type: identity
    output_dim: 151
  action_adapter:
    type: passthrough
  action_mask:
    type: full
  compatibility_sigma: 1.5
  bootstrap:
    weight: 0.0
    horizon: 25
