# sibling-source gate：把在 **slide** 上训练的冻结源用于 **stair** target。
# slide 与 stair 共用同一个 ClimbingUpwards.get_reward 实现，地形不同
# （continuous_mesh vs discrete_slabs）。obs 均为 151 维 identity，无切片风险。
null_option: false
sources:
- name: slide
  manifest: checkpoints/terrain_sources/h1hand_slide/manifest.json
  obs_adapter: {type: identity, output_dim: 151}
  action_adapter: {type: passthrough}
  action_mask: {type: full}
  compatibility_sigma: 1.5
  bootstrap: {weight: 0.0, horizon: 25}
