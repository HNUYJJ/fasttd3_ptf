# Target-agnostic locomotion source bank for stage-conditioned RBO admission.
# Source-specific preferences are deliberately absent: the online target
# evidence probe either selects one source or exactly abstains. With one source
# admitted, equal zero logits give source=0.5 and student=0.5.
null_option: true
sources:
  - name: stand
    manifest: checkpoints/official_sources/h1hand_stand/manifest.json
    obs_adapter: {type: identity, output_dim: 151}
    action_adapter: {type: passthrough}
    action_mask: {type: full}
    compatibility_sigma: 1.5
    bootstrap: {weight: 0.0, horizon: 25}
  - name: walk
    manifest: checkpoints/official_sources/h1hand_walk/manifest.json
    obs_adapter: {type: identity, output_dim: 151}
    action_adapter: {type: passthrough}
    action_mask: {type: full}
    compatibility_sigma: 1.5
    bootstrap: {weight: 0.0, horizon: 25}
  - name: run
    manifest: checkpoints/official_sources/h1hand_run/manifest.json
    obs_adapter: {type: identity, output_dim: 151}
    action_adapter: {type: passthrough}
    action_mask: {type: full}
    compatibility_sigma: 1.5
    bootstrap: {weight: 0.0, horizon: 25}
