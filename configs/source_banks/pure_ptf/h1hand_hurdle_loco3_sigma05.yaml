# Classic PTF multi-teacher signal gate on hurdle.
# All teachers share the hurdle robot observation/action spaces and are used as
# full-policy distillation options. Sigma=0.5 is frozen from the preceding
# action-support diagnostic; this experiment changes option multiplicity, not
# the compatibility calibration.
null_option:
  enabled: true
  name: no_transfer

sources:
  - name: stand
    manifest: checkpoints/official_sources/h1hand_stand/manifest.json
    obs_adapter:
      type: identity
      output_dim: 151
    action_adapter:
      type: passthrough
    action_mask:
      type: full
    compatibility_sigma: 0.5

  - name: walk
    manifest: checkpoints/official_sources/h1hand_walk/manifest.json
    obs_adapter:
      type: identity
      output_dim: 151
    action_adapter:
      type: passthrough
    action_mask:
      type: full
    compatibility_sigma: 0.5

  - name: run
    manifest: checkpoints/official_sources/h1hand_run/manifest.json
    obs_adapter:
      type: identity
      output_dim: 151
    action_adapter:
      type: passthrough
    action_mask:
      type: full
    compatibility_sigma: 0.5
