# 扩源 uniform bank for cabinet(7 源无 bootstrap, rand-big 用;
# 由 build_bigsrc_banks.py 自动生成,勿手改)。
null_option: true
sources:
- name: stand
  manifest: checkpoints/official_sources/h1hand_stand/manifest.json
  obs_adapter:
    type: hb_robot_qpos_qvel
    qpos_dim: 109
    output_dim: 151
  action_adapter:
    type: passthrough
  action_mask:
    type: full
  compatibility_sigma: 1.5
