# expanded terrain safe bank for slide(auto; weight=vs-zero reward-bearing,
# horizon=safe_horizon from transfer_map_v2_expanded)
null_option: true
sources:
- name: stand
  manifest: checkpoints/official_sources/h1hand_stand/manifest.json
  obs_adapter:
    type: identity
    output_dim: 151
  action_adapter:
    type: passthrough
  action_mask:
    type: full
  compatibility_sigma: 1.5
  bootstrap:
    weight: 0.967
    horizon: 50
- name: walk
  manifest: checkpoints/official_sources/h1hand_walk/manifest.json
  obs_adapter:
    type: identity
    output_dim: 151
  action_adapter:
    type: passthrough
  action_mask:
    type: full
  compatibility_sigma: 1.5
  bootstrap:
    weight: 25.487
    horizon: 50
- name: run
  manifest: checkpoints/official_sources/h1hand_run/manifest.json
  obs_adapter:
    type: identity
    output_dim: 151
  action_adapter:
    type: passthrough
  action_mask:
    type: full
  compatibility_sigma: 1.5
  bootstrap:
    weight: 19.473
    horizon: 50
