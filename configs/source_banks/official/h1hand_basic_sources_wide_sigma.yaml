# Diagnostic source bank: same sources as h1hand_basic_sources.yaml but with
# compatibility_sigma widened from 0.25 -> 1.5 to accommodate 61-D action space.
# Default sigma was tuned for 2-D toy domains in the original PTF paper; at
# 61 dimensions a per-dim error of 0.1 already pushes the Gaussian
# compatibility to ~0 with sigma=0.25, which silently disables the
# `update_all_compatible_options` path.
sources:
  - name: stand
    manifest: checkpoints/official_sources/h1hand_stand/manifest.json
    obs_adapter:
      type: robot_only
    action_adapter:
      type: passthrough
    action_mask:
      type: groups
      schema: h1hand_default
      groups: [legs_torso, arms]
    compatibility_sigma: 1.5

  - name: walk
    manifest: checkpoints/official_sources/h1hand_walk/manifest.json
    obs_adapter:
      type: robot_only
    action_adapter:
      type: passthrough
    action_mask:
      type: groups
      schema: h1hand_default
      groups: [legs_torso]
    compatibility_sigma: 1.5

  - name: run
    manifest: checkpoints/official_sources/h1hand_run/manifest.json
    obs_adapter:
      type: robot_only
    action_adapter:
      type: passthrough
    action_mask:
      type: groups
      schema: h1hand_default
      groups: [legs_torso]
    compatibility_sigma: 1.5

  - name: reach
    manifest: checkpoints/official_sources/h1hand_reach/manifest.json
    obs_adapter:
      type: reach
    action_adapter:
      type: passthrough
    action_mask:
      type: groups
      schema: h1hand_default
      groups: [arms, hands]
    compatibility_sigma: 1.5

null_option:
  enabled: true
  name: no_transfer
