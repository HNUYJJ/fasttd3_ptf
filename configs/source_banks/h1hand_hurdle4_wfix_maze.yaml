# hurdle 增量实验 bank for maze(3loco+hurdle, weight=orthosrc 同批 probe, h25;
# 检验 T⁰ 预判扩源收益: hurdle probe 分数超 walk, 对照 wfix-3src 已有 3seed)。
null_option: true
sources:
- name: stand
  manifest: checkpoints/official_sources/h1hand_stand/manifest.json
  obs_adapter:
    type: identity
    output_dim: 151
  action_adapter:
    type: passthrough
  action_mask:
    type: full
  compatibility_sigma: 1.5
  bootstrap:
    weight: 4.583
    horizon: 25
- name: walk
  manifest: checkpoints/official_sources/h1hand_walk/manifest.json
  obs_adapter:
    type: identity
    output_dim: 151
  action_adapter:
    type: passthrough
  action_mask:
    type: full
  compatibility_sigma: 1.5
  bootstrap:
    weight: 11.262
    horizon: 25
- name: run
  manifest: checkpoints/official_sources/h1hand_run/manifest.json
  obs_adapter:
    type: identity
    output_dim: 151
  action_adapter:
    type: passthrough
  action_mask:
    type: full
  compatibility_sigma: 1.5
  bootstrap:
    weight: 10.023
    horizon: 25
- name: hurdle
  manifest: checkpoints/terrain_sources/h1hand_hurdle/manifest.json
